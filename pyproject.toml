[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-core"
version = "0.1.0"
description = "Crypto market microstructure pipeline — tick data to Dollar Run Bars with walk-forward optimization"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Camilo Goyes" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "requests>=2.28.0",
    "vectorbt>=0.25.0",
    "optuna>=3.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "numba>=0.58.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
db = ["redis-py>=5.0.0", "sqlalchemy>=2.0.0", "psycopg2-binary>=2.9.0"]
gpu = ["torch>=2.0.0", "botorch>=0.8.0"]
visualization = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "mplfinance>=0.12",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
]
notebooks = ["ipykernel>=6.25.0", "jupyterlab>=4.0.0"]
dev = ["pytest>=7.4.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.scripts]
trading-core-healthcheck = "src.cli:healthcheck"
trading-core-synthetic = "src.cli:synthetic_example"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["_archive_oneoff", "llm_polymarket", "polymarket_btc", "hf_dataset"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in default args (existing pattern)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path insertion before imports
"tests/*" = ["E402"]
# Legacy files with pre-existing style debt (whitespace in docstrings, etc.)
"src/normalizers/data_normalizer.py" = ["W293", "B006"]
"src/storage/db_reader.py" = ["W293"]
"src/bars/info_bars.py" = ["SIM108"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (dataset integrity checks, skipped by default)",
    "db: requires a reachable TimescaleDB (docker-compose up -d)",
]
filterwarnings = ["ignore::pandas.errors.PerformanceWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
exclude = [
    "_archive_oneoff",
    "llm_polymarket",
    "polymarket_btc",
    "hf_dataset",
    "optimization",
    "scripts",
]
